<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Raju — Vendor Desk</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<main>

  <div class="top">
    <span class="pill">Vendor desk</span>
    <a href="index.html" class="btn ghost">Customer view</a>
  </div>

  <h1>Raju Fresh Vegetables</h1>

  <p class="muted">
    Pack orders. Deliver. Keep today's stock accurate.
  </p>

  <!-- MORNING UPDATE -->

  <section class="card">

    <h2>What's different today?</h2>

    <p class="muted">
      Only tell us what changed. Everything else stays the same.
    </p>

    <textarea
      id="deltaInput"
      rows="3"
      style="width:100%;box-sizing:border-box;margin:10px 0;"
      placeholder="Example: Tomato 48, Bhindi sold out, Palak 20"
    ></textarea>
<button
  id="voiceDelta"
  class="btn full"
  style="margin-bottom:10px;"
  onclick="startVendorVoice()"
>
  🎙 Tap to speak
</button>

<p id="voiceStatus" class="muted"></p>
    <button
      class="btn full"
      onclick="previewDelta()"
    >
      Review changes
    </button>

    <div id="deltaReview"></div>

    <button
      id="publishDelta"
      class="btn full"
      style="display:none;margin-top:10px;"
      onclick="publishDelta()"
    >
      Confirm & publish
    </button>

    <p
      id="deltaMsg"
      class="muted"
    ></p>

  </section>


  <!-- ORDERS -->

  <section class="card">

    <h2>Today's orders</h2>

    <p id="orderStatus" class="muted">
      Loading orders…
    </p>

    <div id="orders"></div>

  </section>


  <!-- INVENTORY -->

  <section class="card">

    <h2>Today's inventory</h2>

    <p class="muted">
      Live stock after customer orders.
    </p>

    <div id="inventory">
      Loading inventory…
    </div>

  </section>

</main>


<script>

const API =
  "https://upnuuqoccdnwzgkrugto.supabase.co/functions/v1/vendor-api";

const money = n =>
  `₹${Number(n || 0).toFixed(0)}`;


function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* -----------------------------
   LOAD VENDOR
----------------------------- */

async function loadVendor() {

  const response =
    await fetch(`${API}?merchant=raju`);

  const data =
    await response.json();

  if (!response.ok)
    throw new Error(
      data.error ||
      "Could not load vendor desk"
    );

  renderOrders(data.orders || []);
  renderInventory(data.inventory || []);

}


/* -----------------------------
   ORDERS
----------------------------- */

function renderOrders(orders) {

  const box =
    document.getElementById("orders");

  const status =
    document.getElementById("orderStatus");


  if (!orders.length) {

    status.textContent =
      "No orders yet.";

    box.innerHTML = "";

    return;

  }


  status.textContent =
    `${orders.length} order${orders.length === 1 ? "" : "s"}`;


  box.innerHTML =
    orders.map(order => {

      const customer =
        order.customers || {};


      const items =
        (order.order_items || [])
        .map(item => `

          <div class="row">

            <span>

              ${escapeHtml(
                item.product_name
              )}

              ×

              ${escapeHtml(
                item.quantity
              )}

              ${escapeHtml(
                item.unit || ""
              )}

            </span>

            <b>
              ${money(
                item.line_total ??
                Number(item.quantity) *
                Number(item.unit_price)
              )}
            </b>

          </div>

        `)
        .join("");


      let action = "";


      if (
        order.status !== "packed" &&
        order.status !== "delivered"
      ) {

        action = `

          <button
            class="btn full"
            onclick="updateStatus(
              '${order.id}',
              'packed'
            )"
          >
            Packed
          </button>

        `;

      }


      if (order.status === "packed") {

        action = `

          <button
            class="btn full"
            onclick="updateStatus(
              '${order.id}',
              'delivered'
            )"
          >
            Delivered
          </button>

        `;

      }


      if (order.status === "delivered") {

        action = `
          <p class="muted">
            ✓ Delivered
          </p>
        `;

      }


      return `

        <div class="card">

          <div class="row">

            <b>
              #${escapeHtml(
                order.order_number
              )}
            </b>

            <span class="pill">
              ${escapeHtml(
                order.status || "new"
              )}
            </span>

          </div>


          <h3>
            ${escapeHtml(
              customer.name ||
              "Customer"
            )}
          </h3>


          <p class="muted">

            ${escapeHtml(
              customer.address || ""
            )}

            <br>

            ${escapeHtml(
              customer.phone || ""
            )}

          </p>


          ${items}


          <div class="row">

            <b>Total</b>

            <b>
              ${money(order.total)}
            </b>

          </div>


          <p class="muted">

            Payment:
            ${escapeHtml(
              order.payment_method || ""
            )}

          </p>


          ${action}

        </div>

      `;

    }).join("");

}


/* -----------------------------
   INVENTORY
----------------------------- */

function renderInventory(inventory) {

  const box =
    document.getElementById(
      "inventory"
    );


  if (!inventory.length) {

    box.innerHTML = `
      <p class="muted">
        No inventory found.
      </p>
    `;

    return;

  }


  box.innerHTML =
    inventory.map(row => {

      const product =
        row.products || {};

      const available =
        row.is_available &&
        Number(row.available_qty) > 0;


      return `

        <div class="row">

          <div>

            <b>
              ${escapeHtml(
                product.canonical_name
              )}
            </b>

            <div class="muted">

              ${money(row.price)}
              /
              ${escapeHtml(
                product.default_unit || ""
              )}

            </div>

          </div>


          <div>

            ${
              available

              ? `${escapeHtml(
                  row.available_qty
                )} available`

              : "Sold out"
            }

          </div>

        </div>

      `;

    }).join("");

}


/* -----------------------------
   MORNING UPDATE
----------------------------- */

let pendingChanges = [];


function previewDelta() {

  const input =
    document
      .getElementById("deltaInput")
      .value
      .trim();

  const review =
    document.getElementById(
      "deltaReview"
    );

  const publish =
    document.getElementById(
      "publishDelta"
    );

  const inventoryRows =
    [...document.querySelectorAll(
      "#inventory .row"
    )];

  const names =
    inventoryRows
      .map(row =>
        row.querySelector("b")
          ?.textContent
          .trim()
      )
      .filter(Boolean);


  pendingChanges = [];


  const parts =
    input
      .split(/[,\n]+/)
      .map(x => x.trim())
      .filter(Boolean);


  for (const part of parts) {

    const lower =
      part.toLowerCase();


    const name =
      names.find(n =>
        lower.startsWith(
          n.toLowerCase()
        )
      );


    if (!name)
      continue;


    const soldOut =
      /sold\s*out|nahi|nahin|unavailable/i
        .test(part);


    const numbers =
      part.match(
        /\d+(?:\.\d+)?/g
      ) || [];


    if (soldOut) {

      pendingChanges.push({

        product_name: name,
        is_available: false,
        available_qty: 0

      });

    }

    else if (numbers.length) {

      pendingChanges.push({

        product_name: name,
        price: Number(numbers[0])

      });

    }

  }


  if (!pendingChanges.length) {

    review.innerHTML = `

      <p class="muted">

        No changes understood.

        Try:
        Tomato 48,
        Bhindi sold out,
        Palak 20

      </p>

    `;

    publish.style.display =
      "none";

    return;

  }


  review.innerHTML = `

    <h3>Review</h3>

    ${pendingChanges.map(change => `

      <div class="row">

        <b>
          ${escapeHtml(
            change.product_name
          )}
        </b>

        <span>

          ${
            change.is_available === false

            ? "Sold out"

            : `Price → ${
                money(change.price)
              }`
          }

        </span>

      </div>

    `).join("")}

  `;


  publish.style.display =
    "block";

}


async function publishDelta() {

  const input =
    document
      .getElementById("deltaInput")
      .value
      .trim();

  const msg =
    document.getElementById(
      "deltaMsg"
    );


  if (!pendingChanges.length)
    return;


  try {

    msg.textContent =
      "Publishing…";


    const response =
      await fetch(API, {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          action:
            "inventory_delta",

          input_text:
            input,

          changes:
            pendingChanges

        })

      });


    const data =
      await response.json();


    if (!response.ok)
      throw new Error(
        data.error ||
        "Could not publish changes"
      );


    msg.textContent =
      "✓ Published. Customer inventory is updated.";


    document.getElementById(
      "deltaInput"
    ).value = "";


    document.getElementById(
      "deltaReview"
    ).innerHTML = "";


    document.getElementById(
      "publishDelta"
    ).style.display =
      "none";


    pendingChanges = [];


    await loadVendor();


  } catch (error) {

    msg.textContent =
      error.message ||
      "Could not publish changes.";

  }

}


/* -----------------------------
   ORDER STATUS
----------------------------- */

async function updateStatus(
  orderId,
  newStatus
) {

  try {

    const response =
      await fetch(API, {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          action: "status",
          order_id: orderId,
          status: newStatus

        })

      });


    const data =
      await response.json();


    if (!response.ok)
      throw new Error(
        data.error ||
        "Could not update order"
      );


    await loadVendor();


  } catch (error) {

    alert(
      error.message ||
      "Could not update order."
    );

  }

}

let vendorRecorder = null;
let vendorAudioChunks = [];
let vendorRecording = false;
let vendorTimer = null;
let vendorSeconds = 0;
let vendorStream = null;

function stopVendorMic() {
  if (vendorStream) {
    vendorStream.getTracks().forEach(track => track.stop());
    vendorStream = null;
  }
}

function resetVendorVoiceUI(message = "") {
  if (vendorTimer) clearInterval(vendorTimer);
  vendorTimer = null;
  vendorRecording = false;
  const status = document.getElementById("voiceStatus");
  const button = document.getElementById("voiceDelta");
  button.disabled = false;
  button.textContent = "🎙 Tap to speak";
  if (message) status.textContent = message;
}

async function startVendorVoice() {
  const status = document.getElementById("voiceStatus");
  const button = document.getElementById("voiceDelta");

  if (vendorRecording && vendorRecorder) {
    vendorRecording = false;
    if (vendorTimer) clearInterval(vendorTimer);
    vendorTimer = null;
    button.disabled = true;
    button.textContent = "⏳ Understanding…";
    status.textContent = "Uploading and transcribing your update…";
    try { vendorRecorder.requestData(); } catch (_) {}
    setTimeout(() => {
      if (vendorRecorder && vendorRecorder.state !== "inactive") vendorRecorder.stop();
    }, 250);
    return;
  }

  try {
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) throw new Error("Audio recording is not supported in this browser.");
    vendorStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    vendorAudioChunks = [];
    vendorSeconds = 0;
    const options = {};
    if (MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) options.mimeType = "audio/webm;codecs=opus";
    vendorRecorder = new MediaRecorder(vendorStream, options);
    vendorRecorder.ondataavailable = event => { if (event.data && event.data.size > 0) vendorAudioChunks.push(event.data); };
    vendorRecorder.onerror = event => {
      stopVendorMic();
      resetVendorVoiceUI(`Recording error: ${event.error?.message || "Unknown error"}`);
    };
    vendorRecorder.onstop = async () => {
      stopVendorMic();
      try {
        const audioBlob = new Blob(vendorAudioChunks, { type: vendorRecorder.mimeType || "audio/webm" });
        if (audioBlob.size < 1000) throw new Error("Recording was too short. Please try again.");
        const form = new FormData();
        form.append("file", audioBlob, "vendor-update.webm");
        const response = await fetch("https://upnuuqoccdnwzgkrugto.supabase.co/functions/v1/voice-transcribe", { method: "POST", body: form });
        let data;
        try { data = await response.json(); } catch (_) { throw new Error("Transcription service returned an invalid response."); }
        if (!response.ok) throw new Error(data.detail || data.error || "Transcription failed");
        const transcript = (data.transcript || "").trim();
        if (!transcript) throw new Error("No speech was detected.");
        document.getElementById("deltaInput").value = transcript;
        resetVendorVoiceUI(`Heard: "${transcript}"`);
        previewDelta();
      } catch (error) {
        resetVendorVoiceUI(`Voice error: ${error.message}`);
      }
    };
    vendorRecorder.start(1000);
    vendorRecording = true;
    button.textContent = "⏹ Stop recording";
    status.textContent = "🔴 Recording — 0:00";
    vendorTimer = setInterval(() => {
      vendorSeconds += 1;
      const minutes = Math.floor(vendorSeconds / 60);
      const seconds = String(vendorSeconds % 60).padStart(2, "0");
      status.textContent = `🔴 Recording — ${minutes}:${seconds}`;
    }, 1000);
  } catch (error) {
    stopVendorMic();
    resetVendorVoiceUI(`Microphone error: ${error.message}`);
  }
}

</script>
</body>
</html>
