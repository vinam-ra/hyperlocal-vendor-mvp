<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raju Fresh Vegetables</title><link rel="stylesheet" href="styles.css"></head><body><main><div class="top"><span class="pill">Neighborhood delivery</span><a href="vendor.html" class="btn ghost">Vendor</a></div><h1>Raju Fresh Vegetables</h1><p class="muted">Today's availability. Type your whole order; voice plugs into the same flow next.</p><section class="card"><h2>What do you need?</h2><button class="btn voice" disabled>🎙 Tap to speak — coming next</button><textarea id="typed" rows="2" placeholder="Try: 2 kg tomato, 1 kg aloo, 500g bhindi"></textarea><button class="btn ghost" onclick="parseTyped()">Add typed order</button></section><section class="card"><h2>Available today</h2><div id="items"></div></section><section class="card"><h2>Your order</h2><div id="cartbox" class="muted">Nothing added yet.</div><div class="row"><b>Total</b><b id="total" class="total">₹0</b></div></section><section class="card"><h2>Delivery details</h2><input id="name" placeholder="Name"><input id="phone" placeholder="Mobile number" inputmode="tel"><textarea id="address" placeholder="Building / flat / delivery address"></textarea><select id="payment"><option>Cash on delivery</option><option>UPI to vendor</option></select><button class="btn full" onclick="placeOrder()">Place order</button><p id="msg" class="muted"></p></section></main><script src="app.js"></script></body></html>
